min_version = "2026.6.10"

[settings]
experimental = true

[tools]
"aqua:dahlia/hongdown" = "0.4.3"
"github:jdx/jactionlint" = "2.1.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"github:nushell/nushell" = "0.114.1"
node = "26"
"npm:@fedify/cli" = { version = "2.4.3", allow_low_downloads = true }
"npm:oxlint" = "1.75.0"
"npm:oxlint-tsgolint" = "7.0.2001"
"npm:pglite-cli" = { version = "0.0.1", allow_low_downloads = true }
oxfmt = "0.55.0"
pnpm = "11"

[deps.pnpm]
auto = true

[hooks]
postinstall = ["mise deps", "mise generate git-pre-commit --task check --write"]

[tasks.build]
description = "Build the project"
depends = ["build:web", "generate:completion"]
silent = "stdout"

[tasks."build:backend"]
description = "Build models, federation, and GraphQL without the application CLI"
run = "pnpm --parallel -F @drfed/federation -F @drfed/graphql -F @drfed/models build"
silent = "stdout"

[tasks."build:server"]
description = "Build the application CLI after its backend and web dependencies"
depends = ["build:backend", "build:web"]
run = "pnpm -F @drfed/drfed build"
silent = "stdout"

[tasks."build:web"]
description = "Build SolidStart frontend server"
depends = [
  { task = "generate:graphql-schema", args = [
    "--output-file",
    "packages/web/schema.graphql",
  ] },
]
dir = "./packages/web"
run = "pnpm exec relay-compiler --noWatchman && pnpm run build"

[tasks."generate:completion"]
description = "Generate bundled completion scripts for all commands and shells"
depends = ["build:server"]
run = "node scripts/generate-completion.mts"

[tasks."test:web-runtime"]
description = "Test the embedded SolidStart runtime without an HTTP listener"
depends = ["build:web"]
run = "node --test packages/web/src/runtime.test.ts"

[tasks."test:packaging"]
description = "Test local and global npm tarball installations"
depends = ["build"]
run = "node scripts/test-packaging.mts"

[tasks."test:completion-installation"]
description = "Probe packed completion discovery and manual loading in five shells"
depends = ["build"]
tools = { "aqua:fish-shell/fish-shell" = "4.9.3", "github:PowerShell/PowerShell" = "7.6.6" }
env = { DRFED_TEST_COMPLETION_SHELLS = "1" }
run = "node scripts/test-packaging.mts"

[tasks.check]
description = "Check all"
depends = ["check:*"]

[tasks."check:workflows"]
description = "Check GitHub workflows and local composite actions"
run = "jactionlint"

[tasks."check:types"]
description = "Check TypeScript types"
run = "pnpm --recursive exec tsc --noEmit"

[tasks."check:lint"]
description = "Check linting"
run = "oxlint"

[tasks."check:fmt"]
description = "Check formatting"
run = "oxfmt --check"

[tasks."check:fmt:docs"]
description = "Check Markdown formatting"
run = "hongdown --check"

[tasks."check:fmt:mise"]
description = "Check mise.toml formatting"
run = "mise fmt --check"

[tasks."check:license"]
description = "Check the license comments of files in the whole codebase."
run = """
#!/usr/bin/env nu
node scripts/add-license/main.mts --check
"""

[tasks."check:migrations"]
description = "Verify immutable migration identities and bundled SQL"
run = "node scripts/migration-manifest.mts"

[tasks."manifest:migrations"]
description = "Verify or append immutable migration identities"
usage = """
flag "--append" help="Append new migrations without changing historical identities"
flag "--base <ref>" help="Compare the immutable prefix with a Git commit"
"""
run = "node scripts/migration-manifest.mts"

[tasks."check:versions"]
description = "Check that all package versions are in sync"
run = "node scripts/check-versions.mts"

[tasks.fmt]
description = "Format files"
depends = ["fmt:*"]
run = "oxfmt --write"

[tasks."fmt:docs"]
description = "Format Markdown documents"
run = "hongdown --write"

[tasks."fmt:mise"]
description = "Format mise.toml"
run = "mise fmt"

[tasks."fmt:license"]
description = "Add license comments to the files that don't have them."
run = """
#!/usr/bin/env nu
node scripts/add-license/main.mts
"""

[tasks.test]
description = "Run tests"
depends = ["build"]
usage = '''
flag "-d --debug" help="Run tests in debug mode"
'''
run = '''
#!/usr/bin/env nu
if "usage_debug" in $env {
  $env.LOGTAPE_TEST_MODE = "always"
  $env.LOGTAPE_TEST_LOWEST_LEVEL = "trace"
} else {
  $env.LOGTAPE_TEST_MODE = "on-failure"
  $env.LOGTAPE_TEST_LOWEST_LEVEL = "debug"
}
pnpm run --parallel --recursive test --test-concurrency=1
'''

[tasks."test:postgres"]
description = "Test migration sessions against an isolated PostgreSQL cluster"
depends = ["build:server"]
run = """
#!/usr/bin/env nu
if "DRFED_TEST_POSTGRES_URL" not-in $env {
  error make {msg: "Set DRFED_TEST_POSTGRES_URL to an isolated PostgreSQL cluster with CREATEDB and CREATEROLE permissions."}
}
if ($env.DRFED_TEST_POSTGRES_URL | str trim | is-empty) {
  error make {msg: "DRFED_TEST_POSTGRES_URL must not be empty."}
}
node --test packages/models/src/migration-session.test.ts
"""

[tasks.bump]
description = "Bump all package versions"
usage = """
arg "<version>" help="New version number"
"""
run = """
#!/usr/bin/env nu
node scripts/bump-versions.mts $env.usage_version
"""

[tasks."generate:account"]
description = "Create an account in the development PGlite database"
depends = ["build:server"]
usage = '''
arg "<email>" help="Account email address"
arg "<name>" help="Account display name"
'''
run = '''
#!/usr/bin/env nu
$env.email = $env.usage_email
$env.name = $env.usage_name
node scripts/create-account.mts
'''

[tasks."generate:migrate"]
description = "Generate database migration files"
usage = """
flag "--name <name>" help="Migration file name"
flag "--custom" help="Prepare empty migration file for custom SQL"
"""
dir = "packages/models"
raw = true
run = """
#!/usr/bin/env nu
let name = (if "usage_name" in $env { ["--name" $env.usage_name] } else { [] })
let custom = (if "usage_custom" in $env { ["--custom"] } else { [] })
pnpm exec drizzle-kit generate ...$name ...$custom
"""
depends_post = ["fmt"]

[tasks."generate:graphql-schema"]
description = "Generate GraphQL schema"
usage = """
flag "-o --output-file <file>" help="The output file for the generated GraphQL schema.  - for stdout.  Defaults to -"
"""
depends = ["build:backend"]
run = """
#!/usr/bin/env nu
let output_file = (if "usage_output_file" in $env { $env.usage_output_file } else { "-" })
with-env { DRFED_SCHEMA_OUTPUT: $output_file } {
  node scripts/generate-graphql-schema.mts
}
"""

[tasks.dev]
description = "Run the development server"
usage = '''
flag "-L --log-level <level>" {
  choices "trace" "debug" "info" "warn" "error" "fatal"
  default "debug"
  help "Set log level"
}
flag "--log-output <path>" help="Write logs to a file"
flag "-S --no-seed" help="Skip database seeding"
'''
run = "node scripts/dev.mts"

[tasks."build:web-runtime"]
description = "Build the external web binding and Node adapter"
dir = "./packages/web"
run = "pnpm exec tsdown"

[tasks."dev:web"]
depends = ["build:web-runtime"]
raw_args = true
description = "Run SolidStart frontend server"
dir = "./packages/web"
run = """
#!/usr/bin/env nu
mise run generate:graphql-schema --output-file ./packages/web/schema.graphql
pnpm run dev
"""

[tasks."drfed-server"]
description = "Invoke drfed-server command"
depends = ["build"]
raw_args = true
run = "node packages/drfed/bin/drfed-server.mjs"
